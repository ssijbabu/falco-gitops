apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: falco
  namespace: falco
  labels:
    app.kubernetes.io/part-of: falco-security-stack
spec:
  # Empty podSelector = applies to every pod in this namespace, deliberately
  # not label-matched to the Falco DaemonSet's specific pod labels: those
  # are generated by the operator's controllers and not something this
  # manifest set controls directly, so matching "all pods in this
  # namespace" is the safer choice over guessing a selector that could
  # silently stop matching after an operator upgrade.
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Prometheus (or any scraper) reaching the Falco webserver's /metrics
    # (port 8765, enabled by default per falco-operator's docs/architecture.md).
    # Adjust the namespaceSelector label to match your monitoring stack.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8765
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Each Falco pod's artifact-operator sidecar pulls Rulesfile/Plugin/Config
    # content from the central falco-operator Deployment's in-cluster
    # artifact-cache server (chart/falco-operator/templates/service.yaml,
    # port 8082) -- NOT from ghcr.io/the OCI registry directly. Only the
    # operator itself needs internet egress to the registry; this namespace
    # doesn't, and this policy doesn't grant it. http_output is disabled by
    # default (see config.yaml) -- widen this if you enable it or add
    # Falcosidekick later.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: falco-operator
      ports:
        - protocol: TCP
          port: 8082
