apiVersion: v1
kind: Namespace
metadata:
  name: falco
  labels:
    app.kubernetes.io/part-of: falco-security-stack
    # falco-operator runs the Falco container as `privileged: true` by
    # default (its own docs/architecture.md: "Security context: Privileged",
    # with hostPath mounts for /proc, /sys, /dev, /etc, and the container
    # runtime socket) -- this is the operator's documented default, not
    # something this manifest set opts into, and it needs the "privileged"
    # PSA level accordingly. Falco 0.44+'s modern_ebpf driver *can* run with
    # a trimmed capability set instead of full `privileged: true` on some
    # setups, but that's not what this operator version defaults to; if you
    # override it via podTemplateSpec.spec.containers[].securityContext in
    # falco.yaml, narrow this label to match.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
