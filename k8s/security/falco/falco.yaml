---
apiVersion: instance.falcosecurity.dev/v1alpha1
kind: Falco
metadata:
  name: falco
  namespace: falco
  labels:
    app.kubernetes.io/managed-by: falco-operator
spec:
  # DaemonSet + modern_ebpf is the default when spec is empty; spelled out
  # here so it's an explicit, reviewable choice rather than an implicit one.
  type: DaemonSet
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  podTemplateSpec:
    spec:
      priorityClassName: falco-security-critical
      nodeSelector:
        kubernetes.io/os: linux
      # Monitor control-plane nodes too, not just workers -- full coverage
      # for a production security-monitoring DaemonSet.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          effect: NoSchedule
      # Pulls the falco image from a private registry instead of the
      # operator's own upstream default. Tag pinned to 0.44.1 to match what
      # this falco-operator version (0.4.x appVersion) defaults to anyway
      # -- see docs/version-matrix.md in the falco-operator repo -- so this
      # is a registry swap, not a version change. Requires a
      # kubernetes.io/dockerconfigjson Secret named
      # `falco-image-pull-secret` in this namespace; see k8s/README.md for
      # how to create it (not committed to git).
      imagePullSecrets:
        - name: falco-image-pull-secret
      containers:
        - name: falco
          image: registry.example.com/falcosecurity/falco:0.44.1
          tty: true
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
