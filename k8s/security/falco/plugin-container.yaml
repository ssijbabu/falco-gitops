---
# Required by the official rules and the custom rules below: without it,
# %container.* / %k8s.* fields in rule outputs render empty (see
# https://falco.org/docs -- collectors.containerEngine). Pulled from a
# private registry mirror rather than ghcr.io directly, via the same
# artifact-operator sidecar mechanism the Falco pod already uses for rules
# (see security/falco/networkpolicy.yaml's egress comment) -- so this is
# still an in-cluster-only pull from the sidecar's perspective, it's the
# operator's central artifact fetch that goes to the private registry now.
apiVersion: artifact.falcosecurity.dev/v1alpha1
kind: Plugin
metadata:
  name: container
  namespace: falco
  labels:
    app.kubernetes.io/managed-by: falco-operator
spec:
  ociArtifact:
    image:
      repository: falcosecurity/plugins/plugin/container
      tag: latest
    registry:
      # Assumed to be Azure Container Registry -- must be
      # "<ACR_NAME>.azurecr.io", matching the ACR_NAME env var in
      # cronjob-acr-token-refresh.yaml (that CronJob derives this same
      # hostname by appending ".azurecr.io" to ACR_NAME).
      name: "<your-acr-name>.azurecr.io"
      # falco-registry-credentials is kept live by
      # cronjob-acr-token-refresh.yaml via Azure Workload Identity -- a
      # username=00000000-0000-0000-0000-000000000000 / password=<ACR
      # refresh token> pair refreshed hourly, not a static secret. See
      # k8s/README.md's "Managed identity for the Plugin OCI pull" section
      # for the one-time Azure-side setup that has to exist before this
      # works (creating the managed identity, granting AcrPull, federating
      # it to the acr-token-refresher ServiceAccount).
      auth:
        secretRef:
          name: falco-registry-credentials
