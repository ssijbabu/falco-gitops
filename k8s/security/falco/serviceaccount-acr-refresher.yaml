---
# Federated to an Azure user-assigned managed identity via the Azure
# Workload Identity webhook. The client-id annotation is a placeholder --
# see k8s/README.md's "Managed identity for the Plugin OCI pull" section
# for the one-time `az identity`/`az identity federated-credential` setup
# (Azure-subscription-level actions, not something this repo can apply)
# that has to reference this ServiceAccount's
# `system:serviceaccount:falco:acr-token-refresher` identity as the
# federated credential's subject before this actually works.
#
# The `azure.workload.identity/use: "true"` label here is a convenience
# marker, not what actually triggers the mutating webhook -- that requires
# the label on the *pod template*, which cronjob-acr-token-refresh.yaml
# also sets. Both need it: the webhook only mutates pods carrying the
# label directly, but it still needs this ServiceAccount's annotation to
# know which identity to federate.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: acr-token-refresher
  namespace: falco
  labels:
    app.kubernetes.io/name: acr-token-refresher
    app.kubernetes.io/part-of: falco-security-stack
    azure.workload.identity/use: "true"
  annotations:
    azure.workload.identity/client-id: "<managed-identity-client-id>"
