---
# Placeholder ONLY, created once then handed off to the acr-token-refresh
# CronJob (cronjob-acr-token-refresh.yaml), which PATCHes it every run with
# a live ACR refresh token. The `ssa: IfNotPresent` annotation tells
# kustomize-controller to create this object if it's missing but never
# reconcile it again afterwards -- without it, Flux's normal
# apply-to-match-git behavior would stomp the CronJob's live credential
# back to this placeholder on every Kustomization reconcile (every 30m per
# clusters/production/security.yaml), breaking the refresh loop. See
# https://fluxcd.io/flux/components/kustomize/kustomizations/#server-side-apply
apiVersion: v1
kind: Secret
metadata:
  name: falco-registry-credentials
  namespace: falco
  labels:
    app.kubernetes.io/part-of: falco-security-stack
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
type: kubernetes.io/basic-auth
stringData:
  username: "00000000-0000-0000-0000-000000000000"
  password: "placeholder-until-first-cronjob-run"
