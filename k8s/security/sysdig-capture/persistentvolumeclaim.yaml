---
# Single shared PersistentVolumeClaim, mounted by every DaemonSet pod at once --
# not one PVC per node. That requires ReadWriteMany: block-storage classes
# (EBS, Azure Disk, GCE PD, most default cluster StorageClasses) only support
# ReadWriteOnce and CANNOT satisfy this, since a single PVC would then only
# ever attach to one node. You need a file-storage-backed StorageClass: NFS
# (in-cluster nfs-subdir-external-provisioner, or a managed NFS server),
# AWS EFS (efs.csi.aws.com), Azure Files (azurefile-csi.azure.com), GCP
# Filestore (filestore.csi.storage.gke.io), or CephFS -- whichever your
# cluster already has. Replace REPLACE_WITH_RWX_STORAGECLASS below with its
# name; there is no working default here, same as falco.yaml's registry
# placeholder.
#
# This is what lets every node write concurrently without the "hostPath
# coordination, no locking" problem the previous sysdig sidecar setup had
# (see k8s/README.md): each DaemonSet pod only ever touches its own
# $(NODE_NAME)/ subdirectory on this shared volume (see daemonset.yaml), so
# there is no file two pods could contend over, without needing any actual
# locking or per-node volume plumbing.
#
# If your cluster genuinely has no ReadWriteMany-capable StorageClass and
# adding one isn't an option, the fallback is a hostPath volume per node
# instead of this PVC (drop this file, change daemonset.yaml's volume to
# `hostPath: {path: /var/lib/sysdig-captures, type: DirectoryOrCreate}`) --
# that's what the old setup did, and it works, it just means the capture
# data doesn't survive that specific node being replaced.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sysdig-capture-data
  namespace: falco
  labels:
    app.kubernetes.io/name: sysdig-capture
    app.kubernetes.io/part-of: falco-security-stack
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: REPLACE_WITH_RWX_STORAGECLASS
  resources:
    requests:
      # Total shared capacity across every node's captures combined, not
      # per-node. Size for: (nodes) x (files/day) x (avg file size) x
      # (retention days) with headroom -- e.g. 10 nodes x 1440 files/day x
      # ~1MB (compressed, -z) x 2 days retention (see daemonset.yaml's
      # RETENTION_MINUTES) is already ~29Gi, and average file size varies a
      # lot with actual syscall volume per node. Start generous and tune
      # down once you've observed real file sizes; running out of space
      # mid-rotation fails that node's write, it doesn't queue or block.
      storage: 100Gi
