---
# Continuous rolling syscall capture, one .scap file per node per minute,
# independent of any Falco rule match -- this is deliberately NOT the same
# thing as Falco's own rule-triggered `capture:` block (see
# security/falco/rulesfile-custom.yaml's comment): that only captures
# around a rule match, this captures unconditionally, on a fixed clock, as
# a rolling forensic buffer you can go back to even for something no rule
# caught.
#
# This DaemonSet is what k8s/README.md describes as "deliberately dropped"
# from the previous setup -- it's back because that specific capability
# (unconditional rolling capture) has no equivalent in the Falco Operator
# model. Storage is node-local (hostPath), not a PersistentVolume: this is
# a short (10-minute) rolling buffer, not data meant to outlive the node or
# be queried centrally, so a PVC's extra moving parts (RWX StorageClass
# prerequisite, network storage latency/cost) buy nothing here. The
# "no locking" concern that applied to the old setup doesn't apply to this
# one regardless of PVC-vs-hostPath: each node's pod only ever touches its
# own host directory, so there was never a file two pods could contend
# over in the first place. Capture uses sysdig's modern eBPF (CO-RE)
# engine via `--modern-bpf`, not the kernel module or legacy eBPF probe --
# see DRIVER-COMPATIBILITY.md for why those two can't work on AKS and why
# this one does (verified live on Azure Linux 3.0, kernel 6.6.150.1-1.azl3).
# The pod is not `privileged`, but its BPF/PERFMON capabilities and
# hostPID still exceed the PSA "baseline" profile; the `falco` namespace
# already carries `pod-security.kubernetes.io/enforce: privileged` (see
# namespace.yaml), so no new PSA exception is needed by reusing it here.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: sysdig-capture
  namespace: falco
  labels:
    app.kubernetes.io/name: sysdig-capture
    app.kubernetes.io/part-of: falco-security-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: sysdig-capture
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sysdig-capture
        app.kubernetes.io/part-of: falco-security-stack
    spec:
      # No Kubernetes API access needed at all -- sysdig captures node-local
      # syscalls, it never calls the API server.
      automountServiceAccountToken: false
      # Reuses Falco's own PriorityClass: this is the same class of
      # security-critical, keep-it-running-under-node-pressure DaemonSet.
      priorityClassName: falco-security-critical
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          effect: NoSchedule
      # Sees host processes/PIDs, required for syscall capture to resolve
      # to real host-level process identities rather than this pod's own
      # (empty) PID namespace.
      hostPID: true
      containers:
        - name: sysdig
          image: docker.io/sysdig/sysdig:0.41.4
          # `command` deliberately REPLACES the image's entrypoint
          # (docker-entrypoint.sh), which runs scap-driver-loader to
          # download/compile a kernel module or legacy eBPF probe. The
          # modern eBPF engine needs neither -- its probe is compiled into
          # the sysdig binary and relocated at load time against the
          # kernel's own BTF (/sys/kernel/btf/vmlinux), so no kernel
          # headers, compiler, or /lib/modules are involved. Letting the
          # entrypoint run would only produce a failed driver build (and
          # misleading logs) before sysdig starts.
          command: ["/usr/bin/sysdig"]
          args:
            # Select the modern eBPF (CO-RE) engine. Without this flag
            # sysdig defaults to the kernel module (/host/dev/scap0);
            # SYSDIG_BPF_PROBE selects the legacy, per-kernel-compiled
            # eBPF probe, NOT this one.
            - --modern-bpf
            # Compress (zlib) -- meaningfully smaller files at the cost of
            # some CPU.
            - -z
            # Rotate to a new file every 60 seconds -- the "every minute"
            # requirement. Rotation is measured from capture start, not
            # aligned to wall-clock :00 seconds.
            - -G
            - "60"
            # Keep at most 10 files: with -G, sysdig deletes the oldest
            # file on each rotation (libsinsp sinsp_cycledumper.cpp), so
            # this is a 10-minute rolling buffer while the process runs.
            # The list of files to delete lives only in sysdig's memory,
            # though, so files from a previous pod (restart, rollout, node
            # drain) are never removed -- capture-cleanup below handles
            # those. Note `sysdig --help` still claims
            # -G + -W "exits when reaching the limit" -- that text is stale;
            # verified live on AKS that it keeps capturing and overwriting.
            # Don't add -C alongside: -C + -G + -W switches to cycling
            # size-based files *within* each timeslice.
            - -W
            - "10"
            # No -s/--snaplen override: sysdig's default captures only the
            # first 80 bytes of each I/O buffer (file/network payloads).
            # Raising it (e.g. `-s 4096`) is more forensically complete
            # but can grow files dramatically -- size the retention for it
            # first.
            - -w
            - /data/sysdig_%Y%m%d_%H%M%S.scap
          resources:
            # Capturing every syscall on a busy node is genuinely CPU-
            # and I/O-intensive -- these are starting points, not tuned
            # numbers; watch actual usage and adjust per node profile.
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            # Minimum capability set for the modern eBPF engine (same set
            # Falco documents for its modern_ebpf driver), verified live
            # on AKS Azure Linux 3.0. Nothing needs `privileged: true`:
            # there's no kernel module to insert and no device node to
            # open.
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add:
                - BPF           # load and attach the eBPF programs
                - PERFMON       # tracepoint/perf ring buffer access
                - SYS_RESOURCE  # raise RLIMIT_MEMLOCK for BPF maps
                - SYS_PTRACE    # read other processes' /proc entries
          volumeMounts:
            # The image sets HOST_ROOT=/host, so sysdig reads host process
            # metadata from /host/proc. /host/dev, /host/boot,
            # /host/lib/modules and /host/usr were only ever needed by
            # scap-driver-loader and are gone with it.
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
            - name: host-etc
              mountPath: /host/etc
              readOnly: true
            - name: capture-data
              mountPath: /data
        - name: capture-cleanup
          # Safety net for files sysdig's own -W ring no longer tracks:
          # anything left in the hostPath by a previous pod. Verified on
          # AKS that without this, every pod restart orphans up to 10
          # files permanently. Separate, non-privileged container so a
          # cleanup bug can't affect capture itself.
          image: docker.io/library/busybox:1.36
          args:
            - sh
            - -c
            - |
              set -eu
              while true; do
                find /data -name '*.scap*' -mmin "+${RETENTION_MINUTES}" -delete
                sleep 60
              done
          env:
            - name: RETENTION_MINUTES
              # Slightly longer than sysdig's own 10 x 60s ring, so this
              # never races the running process's rotation -- it only
              # ever removes files sysdig has already forgotten about.
              value: "12"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: capture-data
              mountPath: /data
      volumes:
        - name: host-proc
          hostPath:
            path: /proc
        - name: host-etc
          hostPath:
            path: /etc
        - name: capture-data
          hostPath:
            path: /var/lib/sysdig-captures
            type: DirectoryOrCreate
